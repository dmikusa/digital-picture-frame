<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Setup Complete</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:480px;margin:0 auto;padding:16px}
        h1{font-size:1.2em;margin-bottom:12px}
        .card{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:12px;margin-bottom:12px}
        .muted{color:#888;font-size:.85em}
    </style>
</head>
<body>
    <h1>Setup Complete</h1>
    <div class="card">
        <p>Your settings have been saved.</p>
    </div>
    <div class="card">
        <p class="muted">The admin server has stopped and the photo frame will resume the
        slideshow. You can unplug the USB drive.</p>
    </div>
</body>
</html>
