name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  # Queue rather than cancel. Cancelling a run in flight can leave a draft
  # release partly updated, and can kill the release job midway through
  # replacing its assets. Only one run waits at a time.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      base: ${{ steps.version.outputs.base }}
      full: ${{ steps.version.outputs.full }}
      sequence: ${{ steps.version.outputs.sequence }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory "$(pwd)"
          BASE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//; s/".*//')
          COMMIT=$(git rev-parse --short HEAD)

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Cargo.toml version '$BASE_VERSION' is not semver (X.Y.Z)"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          SEQUENCE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))

          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full=${BASE_VERSION}-${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "sequence=${SEQUENCE}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_VERSION: ${{ steps.version.outputs.base }}
        run: |
          TAG="v${BASE_VERSION}"
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")

          if [ "$IS_DRAFT" = "false" ]; then
            echo "$TAG is already published, nothing to build"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is not published yet, building"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            pkg-config \
            unzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download font
        run: make font

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"

      - name: Build C display app
        run: make clean -C c && make c

      - name: Build Rust manager
        # Sourcing cargo env here because GITHUB_PATH is unreliable across steps in containers
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked

      - name: Install cargo-deb
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-deb

      - name: Build .deb package
        env:
          FULL_VERSION: ${{ needs.check.outputs.full }}
        run: |
          . "$HOME/.cargo/env"
          cargo deb --deb-version "$FULL_VERSION"

      - name: Rename .deb with architecture
        env:
          FULL_VERSION: ${{ needs.check.outputs.full }}
          ARCH: ${{ matrix.arch }}
        run: |
          SRC=$(ls target/debian/*.deb | head -n1)
          DEST="target/debian/photo-frame_${FULL_VERSION}_${ARCH}.deb"
          mv "$SRC" "$DEST"
          echo "Built: $DEST"

      - name: Build update bundle
        if: matrix.arch == 'arm64'
        env:
          FULL_VERSION: ${{ needs.check.outputs.full }}
          SEQUENCE: ${{ needs.check.outputs.sequence }}
        run: |
          bash scripts/build-update-bundle.sh \
            --version "$FULL_VERSION" \
            --sequence "$SEQUENCE" \
            --arch arm64 \
            --out target/update

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb

      - name: Upload update bundle artifact
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-bundle-arm64
          path: |
            target/update/*.tar.gz
            target/update/*.sha256

  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download .deb artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: Download update bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: update-bundle-arm64
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_VERSION: ${{ needs.check.outputs.base }}
          FULL_VERSION: ${{ needs.check.outputs.full }}
        run: |
          TAG="v${BASE_VERSION}"

          {
            echo "Release ${TAG}"
            echo ""
            echo "Built from \`${FULL_VERSION}\`."
            echo ""
            echo "Assets:"
            echo "- Debian packages for amd64 and arm64"
            echo "- App update bundle and checksum"
            echo ""
            echo "Run the **Sign Release Checksums** workflow before publishing."
          } > notes.md

          STATE=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$STATE" = "true" ]; then
            echo "Updating existing draft release $TAG"
            # Draft assets are rebuilt from scratch for each main push, so
            # remove the previous build's assets instead of accumulating them.
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$TAG" "$asset" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release edit "$TAG" --title "photo-frame ${TAG}" --notes-file notes.md
            gh release upload "$TAG" artifacts/* --clobber
          elif [ -z "$STATE" ]; then
            echo "Creating draft release $TAG"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "photo-frame ${TAG}" \
              --notes-file notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Release $TAG is already published, leaving it alone"
          fi
