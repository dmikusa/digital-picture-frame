# Required: directory where photos are stored and imported. Must exist.
photos_dir = "/var/lib/photo-frame/photos"

# Required: Unix socket the display app creates to receive image paths (IMG).
# The manager connects to this socket to send photos to the screen.
# The display app reads the same path from DISPLAY_SOCKET_PATH in display.env,
# so the two must match.
display_socket_path = "/run/photo-frame/photo-frame.sock"

# Optional: Unix socket the display app creates for control commands
# (CLR/SHOW/RESUME), which the manager uses in config mode to show the setup QR
# screen. The display app reads the same path from CONTROL_SOCKET_PATH in
# display.env, so the two must match.
# Default: "/run/photo-frame/control.sock"
control_socket_path = "/run/photo-frame/control.sock"

# Required: display resolution in "WxH" format. Used for import resizing.
# Example: "1920x1080", "1024x768"
native_resolution = "1920x1080"

# Optional: how to handle aspect ratio mismatch during import.
#   "fit" (default) = letterbox/pillarbox, preserve full photo
#   "fill" = crop to center, fill entire screen
aspect_ratio_mode = "fit"

# Optional: number of oldest photos to delete when disk is full during import.
# Must be > 0. Default: 20
batch_delete_size = 20

# Optional: max log file size in bytes before rotation. Default: 262144 (256 KiB)
# Logs are written to tmpfs (RAM) to avoid SD card wear.
log_max_size = 262144

# Optional: number of rotated log files to retain. Default: 2
log_max_files = 2
